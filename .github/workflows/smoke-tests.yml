name: smoke-tests
on:
  push:
  pull_request:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: dummy
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      postgres-test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobmatch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test models & column projections
        run: pytest tests/test_job_profile_schema.py tests/test_user_profile_schema.py tests/test_profile_columns.py tests/test_user_profile_columns.py -v

      - name: Test migrations
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/jobmatch_test
        run: pytest tests/test_migrations.py -v

      - name: Test database operations
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/jobmatch_test
        run: pytest tests/test_db_user_profiles.py -v

      - name: Test pipeline
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/jobmatch_test
        run: pytest tests/test_extract_resume.py -v
