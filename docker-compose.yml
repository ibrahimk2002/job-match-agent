services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobmatch_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobmatch
    ports:
      - "5432:5432"
    volumes:
      - jobmatch_pgdata:/var/lib/postgresql/data

  db_test:
    image: pgvector/pgvector:pg16
    container_name: jobmatch_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobmatch_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  jobmatch_pgdata:
